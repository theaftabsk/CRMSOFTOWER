# ==========================================
# 1. Marketing Landing Page: zyvocrm.in
# ==========================================
server {
    listen 80;
    server_name zyvocrm.in www.zyvocrm.in;

    root /var/www/crmsoftower/landingpage;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ==========================================
# 2. Next.js App: app.zyvocrm.in
# ==========================================
server {
    listen 80;
    server_name app.zyvocrm.in;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static/ {
        alias /var/www/crmsoftower/frontend/.next/static/;
        expires 365d;
        access_log off;
    }
}

# ==========================================
# 3. NestJS API: api.zyvocrm.in
# ==========================================
server {
    listen 80;
    server_name api.zyvocrm.in;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
